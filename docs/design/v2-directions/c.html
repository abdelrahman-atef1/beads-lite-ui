<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction C - Decisions first</title>
<style>
:root{--bg:#f3f1ec;--surface:#fff;--surface-2:#faf8f4;--fg:#1e2a2b;--muted:#5d6b6c;--border:#e4e0d6;--hover:#ece8de;--soft:#e2f2ef;
--primary:#0b7a75;--primary-fg:#fff;--danger:#c0392b;--warn:#a75d00;--ok:#2e7d4f;--purple:#6b4fbb;--r:12px;--fs:15px;--s4:20px;--s3:12px;
--font:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif}
[data-theme=dark]{--bg:#111716;--surface:#192120;--surface-2:#151c1b;--fg:#d9e4e2;--muted:#93a5a2;--border:#2a3735;--hover:#223130;--soft:#18332f;
--primary:#4fd1c5;--primary-fg:#06211e;--danger:#ff8a7a;--warn:#f2b45c;--ok:#6fd49a;--purple:#b7a4f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs,14px)/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn{border:1px solid transparent;background:var(--hover);padding:5px 12px;border-radius:var(--r);min-height:32px;font-weight:500}
.btn:hover{filter:brightness(.95)}.btn.p{background:var(--primary);color:var(--primary-fg)}
.lnk{background:none;border:0;padding:2px 0;color:var(--primary);text-decoration:underline;min-height:24px}
.spacer{flex:1}.hide{display:none!important}
.ava{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;flex:none}
.id{font-variant-numeric:tabular-nums;color:var(--muted)}
.pill{font-size:12px;min-width:22px;text-align:center;padding:0 6px;border-radius:10px;background:var(--hover);color:var(--muted);font-weight:600;display:inline-block}
.pill.dec{background:var(--purple);color:#fff}.pill.blk{background:var(--danger);color:#fff}
.lbl{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--hover)}.lbl.blk{background:var(--danger);color:#fff}
.pri{font-weight:700}.pri.p0{color:var(--danger)}.pri.p1{color:var(--warn)}
.ico{width:16px;height:16px;border-radius:3px;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.ty-task{background:#4bade8}.ty-bug{background:#e5493a}.ty-story{background:#4ea02b}.ty-epic{background:#6554c0}.ty-decision{background:#8777d9}
/* decision card (shared structure; direction css adds skin) */
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--s4,16px);margin-block-end:var(--s3,12px);border-inline-start:3px solid var(--purple)}
.dcard.done{opacity:.8;border-inline-start-color:var(--ok)}
.dhead{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-block-end:8px}
.dproj{margin-inline-start:auto}
.dq{font-size:1.15em;font-weight:600;margin:0 0 12px;line-height:1.5}
.part{margin-inline-end:4px}
.ask{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;line-height:1;padding:0;margin-inline-start:4px;vertical-align:middle;flex:none}
.ask:hover{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
@media (pointer:coarse){.ask{width:32px;height:32px}}
.opts{display:flex;flex-direction:column;gap:8px}
.optrow{display:flex;align-items:center;gap:8px}
.opt{flex:1;text-align:start;border:1px solid var(--border);background:var(--surface-2,var(--surface));border-radius:var(--r);padding:10px 12px;min-height:44px;display:flex;flex-direction:column;gap:2px}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt small{color:var(--muted)}
.optrow.sel .opt{border-color:var(--ok);background:var(--soft)}
.opt:disabled{cursor:default}
.res{margin:12px 0 0;color:var(--ok)}.res .lnk{margin-inline-start:8px}
.thread{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:var(--r);max-width:92%;background:var(--hover)}
.msg.owner{align-self:flex-end;background:var(--soft)}.msg.agent{align-self:flex-start;border-inline-start:3px solid var(--purple)}
.msg p{margin:2px 0}.msg small{color:var(--muted)}
.about{display:block;font-size:12px;color:var(--muted);margin-block-end:2px}
.pend{color:var(--muted);font-style:italic}.pend::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--purple);margin-inline-end:6px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.2}}
.composer{margin-block-start:12px;display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--hover);border-radius:var(--r)}
.composer textarea{width:100%;border:2px solid var(--border);background:var(--surface);border-radius:var(--r);padding:8px;resize:vertical}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.crow small{flex:1;color:var(--muted);min-width:160px}
.dfoot{margin-block-start:12px}
.desc{margin:0 0 12px}.act{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.act li{display:flex;gap:8px;align-items:flex-start}.act small{color:var(--muted)}
h4{margin:16px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.blkrow{padding:8px;border-radius:var(--r);background:var(--hover)}
.blkrow a{color:var(--primary)}
.inl .dcard{margin:0}
.rep{max-width:560px;display:flex;flex-direction:column;gap:12px}.rep h2{margin:0;font-size:1.3em}
.fl{display:flex;flex-direction:column;gap:4px;font-weight:600}
.rep select,.rep textarea{border:2px solid var(--border);background:var(--surface);border-radius:var(--r);padding:10px;min-height:44px;font-weight:400;width:100%}
.seg{display:flex;gap:8px}.seg button{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);min-height:44px;flex:1;font-weight:600}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tools{display:flex;gap:8px;align-items:center}.tools .sw{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border)}.tools .sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--fg)}
#rc{width:100%;height:auto;border-radius:var(--r);border:1px solid var(--border);touch-action:none;cursor:crosshair;background:var(--hover)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:28px 16px;border:2px dashed var(--border);border-radius:var(--r);cursor:pointer;background:var(--surface)}
.drop:hover,.drop:focus-within{border-color:var(--primary);background:var(--soft)}.drop small,.mut{color:var(--muted);font-size:.9em}
.big{min-height:48px;font-size:1.05em}
.rsent{padding:10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:6px}.rsent img{max-width:100%;border-radius:var(--r)}
.attach{max-width:100%;border-radius:var(--r);border:1px solid var(--border);margin-block-end:12px}
/* phone: decision inbox answers live here (no Telegram) */
@media (max-width:600px){.dcard{padding:14px}.opt{min-height:56px}.ask{width:36px;height:36px;font-size:14px}.crow .btn{flex:1;min-height:44px}.lnk{min-height:44px;display:inline-flex;align-items:center}.msg{max-width:100%}.composer textarea{font-size:16px}}
.fab{display:none}
@media (max-width:760px){.fab{display:flex;position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:8;align-items:center;min-height:52px;padding:0 20px;border-radius:26px;background:var(--primary);color:var(--primary-fg);font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}.fab::after{content:"+ Report a bug"}html:lang(ar) .fab::after{content:"+ أبلغ عن خطأ"}}

.btn{border-radius:999px;min-height:40px;padding:6px 16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:var(--primary)}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px;min-width:0}
.pc{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px}
.pc[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 2px var(--soft);font-weight:700}
.pc .pill{font-size:12px}
.nav{display:flex;gap:4px;padding:0 20px;border-block-end:1px solid var(--border)}
.nav a{padding:10px 16px;color:var(--muted);text-decoration:none;font-weight:600;border-block-end:3px solid transparent;display:flex;gap:6px;align-items:center}
.nav a[aria-current=page]{color:var(--primary);border-color:var(--primary)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;padding:24px 20px;max-width:1280px;margin:0 auto}
.wrap.one{grid-template-columns:1fr}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
.dcard{border-inline-start-width:5px;border-radius:var(--r);padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dq{font-size:1.25em}
.opt{min-height:56px;border-radius:10px;padding:12px 16px;font-size:1em}
.opt b{font-size:1.05em}.ask{width:28px;height:28px;font-size:13px}
.dcard .btn.p{min-height:44px}
.rail{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px;align-self:start}
.rail h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0}
.ag{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;align-items:flex-start;text-align:start;width:100%}
.ag .ava{width:34px;height:34px;font-size:12px}
.ag b{display:block}.ag small{color:var(--muted);display:block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;background:var(--muted)}
.dot.work{background:var(--ok);animation:pulse 1.2s infinite alternate}.dot.wait{background:var(--warn)}
.bd{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-block-end:12px;align-items:start}
.bc{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:10px;min-height:100px}
.bc.you{background:var(--soft);border-color:var(--primary)}
.bc h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.k{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;margin-block-end:8px;width:100%;text-align:start;display:block}
.k:hover{border-color:var(--primary)}.k .m{display:flex;gap:8px;align-items:center;margin-block-start:8px;color:var(--muted);font-size:13px}.k .m .ava{margin-inline-start:auto}
.ep{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-block-end:12px;overflow:hidden}
.ep header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--surface-2)}
.bar{height:6px;border-radius:3px;background:var(--hover);flex:0 0 120px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.it{display:flex;gap:10px;align-items:center;padding:10px 16px;border-block-start:1px solid var(--border);width:100%;border-inline:0;border-block-end:0;background:none;text-align:start}
.it:hover{background:var(--hover)}.it .t{flex:1}
#sheet{position:fixed;inset:0;display:none;background:rgba(10,20,20,.5);z-index:10;align-items:center;justify-content:center;padding:16px}#sheet.on{display:flex}
#sheet .card{background:var(--surface);border-radius:16px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:24px}
.empty{padding:32px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:var(--r)}
.tab-m{display:none}
@media (max-width:860px){.chips{flex-basis:100%;order:3}.nav a{white-space:nowrap}.top .btn{min-height:36px;padding:4px 12px}.logo{flex:1}.wrap{grid-template-columns:1fr;padding:16px 12px}.rail{position:static}.nav{overflow-x:auto;padding:0 8px}.top{padding:12px}#sheet{align-items:flex-end;padding:0}#sheet .card{border-radius:16px 16px 0 0}.bd{grid-template-columns:repeat(5,80vw)}}
</style>
</head>
<body>
<header class="top"><span class="logo">Beads</span><div class="chips" id="chips" role="group"></div><button class="btn" id="theme"></button><button class="btn" id="dir">AR / EN</button></header>

<main class="wrap" id="wrap"></main>
<div id="sheet" role="dialog" aria-modal="true"></div>

function tgtLabel(d,t){if(t==='q')return L('The whole question','السؤال كله');
 if(t[0]==='p')return '“'+tl(d.q[+t.slice(1)])+'”';
 const o=d.opts.find(o=>o.k===t.slice(2));return L('Option: ','الخيار: ')+tl(o.l);}
function decHTML(d){const tg=d.target||'q',n=d.th.filter(m=>m.who==='owner').length;
 const aq=L('Ask about this part','اسأل عن هذا الجزء'),ao=L('Ask about this option','اسأل عن هذا الخيار');
 return `<article class="dcard${d.pick?' done':''}" data-d="${d.id}">
 <header class="dhead"><span class="id">${d.bead}</span>${av(d.ag,22)}<span class="dwho">${d.ag} ${L('asks','يسأل')}</span><span class="dproj">${d.proj}</span></header>
 <h3 class="dq">${d.q.map((p,i)=>`<span class="part">${esc(tl(p))}<button class="ask" data-ask="p${i}" title="${aq}" aria-label="${aq}">?</button></span>`).join(' ')}</h3>
 <div class="opts" role="group" aria-label="${L('Options','الخيارات')}">${d.opts.map(o=>`<div class="optrow${d.pick===o.k?' sel':''}"><button class="opt" data-pick="${o.k}" ${d.pick?'disabled':''}><b>${esc(tl(o.l))}</b><small>${esc(tl(o.e))}</small></button><button class="ask" data-ask="o:${o.k}" title="${ao}" aria-label="${ao}">?</button></div>`).join('')}</div>
 ${d.pick?`<p class="res" role="status">${L('You chose','اخترت')} <b>${esc(tl(d.opts.find(o=>o.k===d.pick).l))}</b>. ${L('Recorded on the bead.','سُجّل على المهمة.')} <button class="lnk" data-undo>${L('Undo','تراجع')}</button></p>`:''}
 ${d.th.length?`<ol class="thread" aria-label="${L('Clarification thread','نقاش التوضيح')}">${d.th.map(m=>`<li class="msg ${m.who}"><span class="about">${L('About','بخصوص')}: ${esc(tgtLabel(d,m.tg))}</span><p>${m.pend?`<span class="pend">${L('Agent woken, replying…','تم إيقاظ الوكيل، يجهّز الرد…')}</span>`:esc(m.who==='owner'?m.x:tl(m.x))}</p><small>${m.who==='owner'?L('You','أنت'):d.ag}</small></li>`).join('')}</ol>`:''}
 ${d.open?`<div class="composer"><div class="about">${L('Asking about','تسأل عن')}: <b>${esc(tgtLabel(d,tg))}</b> <button class="lnk" data-ask="q">${L('whole question instead','السؤال كله بدلاً من ذلك')}</button></div>
 <textarea rows="2" data-draft placeholder="${L('What is unclear? The agent will answer here.','ما غير الواضح؟ سيرد الوكيل هنا.')}">${esc(d.draft||'')}</textarea>
 <div class="crow"><small>${L('Offline? Your question is kept and sent when you are back.','بلا إنترنت؟ يُحفظ سؤالك ويُرسل عند عودتك.')}</small><button class="btn" data-close>${L('Cancel','إلغاء')}</button><button class="btn p" data-send>${L('Ask','اسأل')}</button></div></div>`
 :`<footer class="dfoot"><button class="lnk" data-ask="q">${L('Not clear? Ask the agent','غير واضح؟ اسأل الوكيل')}${n?` (${n})`:''}</button></footer>`}
 </article>`;}
function wireDec(root,rerender){
 root.onclick=e=>{const c=e.target.closest('.dcard');if(!c)return;const d=DEC.find(x=>x.id===c.dataset.d),b=e.target.closest('button');if(!b)return;
  if(b.dataset.pick){d.pick=b.dataset.pick;rerender();}
  else if('undo' in b.dataset){d.pick=null;rerender();}
  else if(b.dataset.ask){d.open=true;d.target=b.dataset.ask;rerender();const t=$(`[data-d=${d.id}] textarea`,root);t&&t.focus();}
  else if('close' in b.dataset){d.open=false;rerender();}
  else if('send' in b.dataset){const v=(d.draft||'').trim();if(!v)return;const tg=d.target||'q';
   d.th.push({who:'owner',tg,x:v});const m={who:'agent',tg,pend:1,x:null};d.th.push(m);d.draft='';d.open=false;rerender();
   setTimeout(()=>{const k=tg==='q'?'q':tg[0]==='p'?tg:'o'+tg.slice(2);m.x=d.rep[k]||d.rep.q||['Good question. I added the detail to the bead.','سؤال جيد. أضفت التفاصيل إلى المهمة.'];m.pend=0;rerender();},1400);}};
 root.oninput=e=>{if(e.target.matches('[data-draft]')){DEC.find(x=>x.id===e.target.closest('.dcard').dataset.d).draft=e.target.value;}};}
const pendingCount=()=>DEC.filter(d=>!d.pick).length;
/* ---- issue detail body (shared) ---- */
function detailBody(i){const d=i.dec&&DEC.find(x=>x.id===i.dec);
 return `<p class="desc">${L('Users on slow connections lose their session before the first screen loads. Target: usable in 60 seconds on a 3G phone, no account needed.','يفقد المستخدمون على الشبكات البطيئة جلستهم قبل ظهور أول شاشة. الهدف: استخدام فعلي خلال 60 ثانية على هاتف 3G دون حساب.')}</p>
 ${i.img?`<img class="attach" src="${i.img}" alt="">`:""}
 ${i.blk?`<p class="blkrow"><span class="lbl blk">${L('Blocked by','محجوب بواسطة')}</span> <a href="#" data-open="${i.blk}">${i.blk}</a> ${esc(it(byId(i.blk)))}</p>`:''}
 ${d?`<div class="inl" data-decwrap>${decHTML(d)}</div>`:''}
 <h4>${L('Activity','النشاط')}</h4>
 <ul class="act"><li>${av('swe',20)}<span><b>swe</b> ${L('pushed a fix, tests pass','دفع إصلاحاً والاختبارات ناجحة')} <small>12m</small></span></li>
 <li>${av('qa',20)}<span><b>qa</b> ${L('reproduced on a throttled 3G profile','أعاد الخطأ على شبكة 3G مبطّأة')} <small>2h</small></span></li>
 <li>${av('pm',20)}<span><b>pm</b> ${L('set priority P1','حدّد الأولوية P1')} <small>1d</small></span></li></ul>`;}
const fields=i=>[[L('Status','الحالة'),tl(ST[i.st])],[L('Assignee','المسند إليه'),i.a],[L('Priority','الأولوية'),'P'+i.p],[L('Epic','الملحمة'),i.ep],[L('Type','النوع'),i.ty],[L('Project','المشروع'),'rayeh']];
/* ---- phone report: screenshot + markup + text + project -> new bead (mock) ---- */
const REPS=[];let rp={img:null,proj:'rayeh',kind:'bug',text:'',col:'#e5322d',strokes:[],cur:null};
const COLS=[['#e5322d','Red pen','قلم أحمر'],['#f5c400','Yellow pen','قلم أصفر'],['#1e88e5','Blue pen','قلم أزرق']];
function reportHTML(){
 return `<section class="rep" id="rep"><h2>${L('Report a bug or note','أبلغ عن خطأ أو اترك ملاحظة')}</h2>
 <label class="fl">${L('Project','المشروع')}<select data-rp="proj">${PROJ.map(p=>`<option ${p.n===rp.proj?'selected':''}>${p.n}</option>`).join('')}</select></label>
 <div class="seg" role="group" aria-label="${L('Type','النوع')}"><button data-rk="bug" aria-pressed="${rp.kind==='bug'}">${L('Bug','خطأ')}</button><button data-rk="note" aria-pressed="${rp.kind==='note'}">${L('Note','ملاحظة')}</button></div>
 ${rp.img?`<div class="tools">${COLS.map(c=>`<button data-rcol="${c[0]}" aria-pressed="${rp.col===c[0]}" aria-label="${L(c[1],c[2])}" style="--c:${c[0]}" class="sw"></button>`).join('')}<span class="spacer"></span><button class="btn" data-rundo>${L('Undo','تراجع')}</button><button class="btn" data-rdrop>${L('Remove','حذف')}</button></div><canvas id="rc" aria-label="${L('Screenshot, draw on it to mark','لقطة الشاشة، ارسم عليها للتأشير')}"></canvas><small class="mut">${L('Draw with your finger to mark the problem.','ارسم بإصبعك لتحديد المشكلة.')}</small>`
 :`<label class="drop"><input type="file" accept="image/*" data-rfile hidden><b>${L('Add a screenshot','أضف لقطة شاشة')}</b><small>${L('Choose from gallery or take a photo, or paste (Ctrl+V). Optional.','اختر من المعرض أو صوّر، أو الصق (Ctrl+V). اختياري.')}</small></label>`}
 <label class="fl">${L('What happened?','ماذا حدث؟')}<textarea rows="4" data-rp="text" placeholder="${L('Write in Arabic or English','اكتب بالعربية أو الإنجليزية')}">${esc(rp.text)}</textarea></label>
 <small class="mut">${L('The image is shrunk on your phone before sending (about 100 KB). Offline? It is kept and sent later.','تُصغَّر الصورة على هاتفك قبل الإرسال (حوالي 100 كيلوبايت). بلا إنترنت؟ تُحفظ وتُرسل لاحقاً.')}</small>
 <button class="btn p big" data-rsend>${L('Send as a bead','أرسل كمهمة')}</button>
 ${REPS.length?`<h4>${L('Just sent','أُرسل الآن')}</h4>${REPS.map(r=>`<div class="rsent"><span><b class="id">${r.id}</b> <span class="lbl">${r.proj}</span> ${esc(r.text||'')}</span>${r.img?`<img src="${r.img}" alt="${L('attached screenshot','لقطة مرفقة')}">`:''}<small class="mut">${L('Created as a bead, assigned for triage.','أُنشئت كمهمة وأُسندت للفرز.')}</small></div>`).join('')}`:''}</section>`;}
function loadImg(file){if(!file||!file.type.startsWith('image/'))return;const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const s=Math.min(1,1280/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);rp.img=c;rp.strokes=[];URL.revokeObjectURL(u);rp.cb();};im.src=u;}
function paintReport(){const c=$('#rc');if(!c||!rp.img)return;if(c.width!==rp.img.width){c.width=rp.img.width;c.height=rp.img.height;}const x=c.getContext('2d');x.drawImage(rp.img,0,0);x.lineCap=x.lineJoin='round';x.lineWidth=Math.max(4,c.width/140);
 [...rp.strokes,...(rp.cur?[rp.cur]:[])].forEach(s=>{x.strokeStyle=s.c;x.beginPath();s.p.forEach((q,n)=>n?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));if(s.p.length===1)x.lineTo(s.p[0][0]+.1,s.p[0][1]);x.stroke();});}
const ptr=(c,e)=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};
function wireReport(root,rerender){rp.cb=()=>{rerender();paintReport();};
 root.addEventListener('click',e=>{const b=e.target.closest('#rep button');if(!b)return;const d=b.dataset;
  if(d.rk){rp.kind=d.rk;rerender();}else if(d.rcol){rp.col=d.rcol;rerender();}else if('rundo' in d){rp.strokes.pop();rerender();}else if('rdrop' in d){rp.img=null;rp.strokes=[];rerender();}
  else if('rsend' in d){if(!rp.text.trim()&&!rp.img)return;const id='r-'+(120+REPS.length);let img=null;const cv=$('#rc');if(cv)img=cv.toDataURL('image/jpeg',.7);
   const r={id,proj:rp.proj,kind:rp.kind,text:rp.text.trim(),img};REPS.unshift(r);
   if(rp.proj==='rayeh')ISS.unshift({id,t:[r.text||'Screenshot report',r.text||'بلاغ بلقطة شاشة'],ty:rp.kind==='bug'?'bug':'task',st:'open',p:2,a:'pm',ep:'Reports',img});
   rp.img=null;rp.strokes=[];rp.text='';rerender();}});
 root.addEventListener('input',e=>{const t=e.target;if(t.dataset.rp)rp[t.dataset.rp]=t.value;});
 root.addEventListener('change',e=>{if(e.target.matches('[data-rfile]'))loadImg(e.target.files[0]);});
 root.addEventListener('pointerdown',e=>{if(e.target.id!=='rc')return;e.target.setPointerCapture(e.pointerId);rp.cur={c:rp.col,p:[ptr(e.target,e)]};paintReport();});
 root.addEventListener('pointermove',e=>{if(rp.cur&&e.target.id==='rc'){rp.cur.p.push(ptr(e.target,e));paintReport();}});
 const end=()=>{if(rp.cur){rp.strokes.push(rp.cur);rp.cur=null;paintReport();}};root.addEventListener('pointerup',end);root.addEventListener('pointercancel',end);
 document.addEventListener('paste',e=>{const f=[...((e.clipboardData&&e.clipboardData.files)||[])][0];if(f&&$('#rep'))loadImg(f);});}

let view=location.hash.slice(1)||'inbox',cur=null;
const V={inbox:['Needs you','يحتاجك'],board:['Board','اللوحة'],backlog:['Backlog','الباكلوج'],report:['Report','بلاغ']};
function k(i){return `<button class="k" data-open="${i.id}"><div>${esc(it(i))}</div><div class="m"><span class="ico ty-${i.ty}">${TY[i.ty]}</span><span class="id">${i.id}</span><span class="pri p${i.p}">P${i.p}</span>${i.blk?`<span class="lbl blk">${L('blocked by','محجوب بـ')} ${i.blk}</span>`:''}${av(i.a)}</div></button>`;}
function rail(){return `<aside class="rail"><h2>${L('Agents now','الوكلاء الآن')}</h2>${AGENTS.map(g=>`<div class="ag">${av(g.a)}<div><b><span class="dot ${g.s}"></span>${g.a} <small style="display:inline">${g.t}</small></b><span>${tl(g.w)}</span><small>${tl(g.l)}</small></div></div>`).join('')}</aside>`;}
function render(){
 $('#chips').innerHTML=PROJ.map(p=>`<button class="pc" aria-pressed="${p.n==='rayeh'}">${p.n}<span class="pill">${p.o}</span>${p.d?`<span class="pill dec" title="${L('decisions','قرارات')}">${p.d}</span>`:''}${p.b?`<span class="pill blk" title="${L('blocked','محجوب')}">${p.b}</span>`:''}</button>`).join('');
 $('#theme').innerHTML='&#9680; '+L('Dark','داكن');
 $('#nav').innerHTML=Object.keys(V).map(x=>`<a href="#${x}" ${view===x?'aria-current="page"':''}>${tl(V[x])}${x==='inbox'?` <span class="pill dec">${pendingCount()}</span>`:''}</a>`).join('');
 const w=$('#wrap');w.classList.toggle('one',view!=='inbox');let h='';
 if(view==='inbox'){const n=pendingCount();
  h=`<section><h1>${n?L(`${n} decisions are waiting for you`,`${n} قرارات تنتظرك`):L('Nothing needs you','لا شيء يحتاجك')}</h1><p class="sub">${L('Agents are paused on these. Choose an option, or ask if the question is unclear.','الوكلاء متوقفون على هذه. اختر خياراً أو اسأل إن كان السؤال غير واضح.')}</p><div id="decs">${DEC.map(decHTML).join('')}</div>${n?'':`<div class="empty">${L('All clear. Agents keep working.','كل شيء واضح. الوكلاء يواصلون العمل.')}</div>`}</section>`+rail();}
 if(view==='report')h=reportHTML();
 if(view==='board'){const cols=[['you',['Needs you','يحتاجك'],i=>i.dec],['w',['Agents working','وكلاء يعملون'],i=>i.st==='progress'],['q',['Queued','في الانتظار'],i=>i.st==='open'],['t',['Waiting for QA','بانتظار الاختبار'],i=>i.st==='waiting'],['b',['Blocked','محجوب'],i=>i.st==='blocked'&&!i.dec]];
  h=`<section><h1>${L('rayeh board','لوحة rayeh')}</h1><p class="sub">${L('Columns show who holds the next move.','الأعمدة تبيّن من بيده الخطوة التالية.')}</p><div class="bd">${cols.map(c=>{const g=ISS.filter(c[2]);return `<div class="bc ${c[0]}"><h3><span>${tl(c[1])}</span><span class="pill">${g.length}</span></h3>${g.map(k).join('')||`<p class="empty" style="padding:12px">${L('Empty','فارغ')}</p>`}</div>`}).join('')}</div><p class="sub">${L('Done: 1 hidden','تم: 1 مخفية')}</p></section>`;}
 if(view==='backlog'){const eps=[...new Set(ISS.map(i=>i.ep))];
  h=`<section><h1>${L('Backlog by epic','الباكلوج حسب الملحمة')}</h1><p class="sub">${L('Grouped by epic, most urgent first.','مجمّعة حسب الملحمة، الأكثر إلحاحاً أولاً.')}</p>${eps.map(e=>{const g=ISS.filter(i=>i.ep===e).sort((a,b)=>a.p-b.p),d=g.filter(i=>i.st==='done').length;return `<div class="ep"><header><b>${e}</b><span class="bar"><i style="width:${100*d/g.length}%"></i></span><span class="id">${d}/${g.length}</span></header>${g.map(i=>`<button class="it" data-open="${i.id}"><span class="ico ty-${i.ty}">${TY[i.ty]}</span><span class="id">${i.id}</span><span class="t">${esc(it(i))}</span>${i.dec?`<span class="lbl" style="background:var(--purple);color:#fff">${L('Needs you','يحتاجك')}</span>`:''}<span class="id">${tl(ST[i.st])}</span><span class="pri p${i.p}">P${i.p}</span>${av(i.a)}</button>`).join('')}</div>`}).join('')}</section>`;}
 w.innerHTML=h;paintReport();
 const s=$('#sheet');s.classList.toggle('on',!!cur);
 if(cur){const i=byId(cur);s.innerHTML=`<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="ico ty-${i.ty}">${TY[i.ty]}</span><span class="id">${i.id}</span><span class="spacer"></span><button class="btn" data-x>${L('Close','إغلاق')}</button></div><h2 style="margin:12px 0">${esc(it(i))}</h2><p style="display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)">${fields(i).map(f=>`<span>${f[0]}: <b style="color:var(--fg)">${esc(f[1])}</b></span>`).join('')}</p>${detailBody(i)}</div>`;}
}
document.addEventListener('click',e=>{const t=e.target;const o=t.closest('[data-open]');
 if(o&&!t.closest('.dcard')){e.preventDefault();cur=o.dataset.open;render();return;}
 if(t.closest('[data-x]')||t.id==='sheet'){cur=null;render();}
 if(t.closest('#theme'))H.dataset.theme=H.dataset.theme==='dark'?'light':'dark';
 if(t.closest('#dir')){const ar=H.lang!=='ar';H.lang=ar?'ar':'en';H.dir=ar?'rtl':'ltr';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cur=null;render();}});
addEventListener('hashchange',()=>{view=location.hash.slice(1)||'inbox';render();});
wireDec(document.body,render);wireReport(document.body,render);render();
</script>
