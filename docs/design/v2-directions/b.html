<title>Direction B - Linear-style</title>
<style>
:root{--bg:#fbfbfc;--surface:#fff;--surface-2:#f6f6f8;--fg:#1f2023;--muted:#6b6f76;--border:#e6e6ea;--hover:#efeff2;--soft:#eceefc;
--primary:#5e6ad2;--primary-fg:#fff;--danger:#d1344b;--warn:#b86e00;--ok:#2a8f5b;--purple:#7c5cd6;--r:6px;--fs:13px;--s4:12px;--s3:8px;
--font:Inter,system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif}
[data-theme=dark]{--bg:#0e0f11;--surface:#16171a;--surface-2:#1b1c20;--fg:#d7d8db;--muted:#8a8f98;--border:#26272b;--hover:#202125;--soft:#23264a;
--primary:#8b95ee;--primary-fg:#10112a;--danger:#ff7b8e;--warn:#f0b24a;--ok:#5fd29a;--purple:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs,14px)/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.btn{border:1px solid transparent;background:var(--hover);padding:5px 12px;border-radius:var(--r);min-height:32px;font-weight:500}
.btn:hover{filter:brightness(.95)}.btn.p{background:var(--primary);color:var(--primary-fg)}
.lnk{background:none;border:0;padding:2px 0;color:var(--primary);text-decoration:underline;min-height:24px}
.spacer{flex:1}.hide{display:none!important}
.ava{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;flex:none}
.id{font-variant-numeric:tabular-nums;color:var(--muted)}
.pill{font-size:12px;min-width:22px;text-align:center;padding:0 6px;border-radius:10px;background:var(--hover);color:var(--muted);font-weight:600;display:inline-block}
.pill.dec{background:var(--purple);color:#fff}.pill.blk{background:var(--danger);color:#fff}
.lbl{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--hover)}.lbl.blk{background:var(--danger);color:#fff}
.pri{font-weight:700}.pri.p0{color:var(--danger)}.pri.p1{color:var(--warn)}
.ico{width:16px;height:16px;border-radius:3px;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.ty-task{background:#4bade8}.ty-bug{background:#e5493a}.ty-story{background:#4ea02b}.ty-epic{background:#6554c0}.ty-decision{background:#8777d9}
/* decision card (shared structure; direction css adds skin) */
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--s4,16px);margin-block-end:var(--s3,12px);border-inline-start:3px solid var(--purple)}
.dcard.done{opacity:.8;border-inline-start-color:var(--ok)}
.dhead{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-block-end:8px}
.dproj{margin-inline-start:auto}
.dq{font-size:1.15em;font-weight:600;margin:0 0 12px;line-height:1.5}
.part{margin-inline-end:4px}
.ask{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;line-height:1;padding:0;margin-inline-start:4px;vertical-align:middle;flex:none}
.ask:hover{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
@media (pointer:coarse){.ask{width:32px;height:32px}}
.opts{display:flex;flex-direction:column;gap:8px}
.optrow{display:flex;align-items:center;gap:8px}
.opt{flex:1;text-align:start;border:1px solid var(--border);background:var(--surface-2,var(--surface));border-radius:var(--r);padding:10px 12px;min-height:44px;display:flex;flex-direction:column;gap:2px}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}
.opt small{color:var(--muted)}
.optrow.sel .opt{border-color:var(--ok);background:var(--soft)}
.opt:disabled{cursor:default}
.res{margin:12px 0 0;color:var(--ok)}.res .lnk{margin-inline-start:8px}
.thread{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 12px;border-radius:var(--r);max-width:92%;background:var(--hover)}
.msg.owner{align-self:flex-end;background:var(--soft)}.msg.agent{align-self:flex-start;border-inline-start:3px solid var(--purple)}
.msg p{margin:2px 0}.msg small{color:var(--muted)}
.about{display:block;font-size:12px;color:var(--muted);margin-block-end:2px}
.pend{color:var(--muted);font-style:italic}.pend::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--purple);margin-inline-end:6px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.2}}
.composer{margin-block-start:12px;display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--hover);border-radius:var(--r)}
.composer textarea{width:100%;border:2px solid var(--border);background:var(--surface);border-radius:var(--r);padding:8px;resize:vertical}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.crow small{flex:1;color:var(--muted);min-width:160px}
.dfoot{margin-block-start:12px}
.desc{margin:0 0 12px}.act{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.act li{display:flex;gap:8px;align-items:flex-start}.act small{color:var(--muted)}
h4{margin:16px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.blkrow{padding:8px;border-radius:var(--r);background:var(--hover)}
.blkrow a{color:var(--primary)}
.inl .dcard{margin:0}
.rep{max-width:560px;display:flex;flex-direction:column;gap:12px}.rep h2{margin:0;font-size:1.3em}
.fl{display:flex;flex-direction:column;gap:4px;font-weight:600}
.rep select,.rep textarea{border:2px solid var(--border);background:var(--surface);border-radius:var(--r);padding:10px;min-height:44px;font-weight:400;width:100%}
.seg{display:flex;gap:8px}.seg button{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);min-height:44px;flex:1;font-weight:600}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tools{display:flex;gap:8px;align-items:center}.tools .sw{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border)}.tools .sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--fg)}
#rc{width:100%;height:auto;border-radius:var(--r);border:1px solid var(--border);touch-action:none;cursor:crosshair;background:var(--hover)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:28px 16px;border:2px dashed var(--border);border-radius:var(--r);cursor:pointer;background:var(--surface)}
.drop:hover,.drop:focus-within{border-color:var(--primary);background:var(--soft)}.drop small,.mut{color:var(--muted);font-size:.9em}
.big{min-height:48px;font-size:1.05em}
.rsent{padding:10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:6px}.rsent img{max-width:100%;border-radius:var(--r)}
.attach{max-width:100%;border-radius:var(--r);border:1px solid var(--border);margin-block-end:12px}
/* phone: decision inbox answers live here (no Telegram) */
@media (max-width:600px){.dcard{padding:14px}.opt{min-height:56px}.ask{width:36px;height:36px;font-size:14px}.crow .btn{flex:1;min-height:44px}.lnk{min-height:44px;display:inline-flex;align-items:center}.msg{max-width:100%}.composer textarea{font-size:16px}}
.fab{display:none}
@media (max-width:760px){.fab{display:flex;position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:8;align-items:center;min-height:52px;padding:0 20px;border-radius:26px;background:var(--primary);color:var(--primary-fg);font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}.fab::after{content:"+ Report a bug"}html:lang(ar) .fab::after{content:"+ أبلغ عن خطأ"}}

body{height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.side{background:var(--surface-2);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;padding:8px;gap:2px;overflow:auto}
.side h5{margin:12px 8px 4px;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:start;padding:5px 8px;border-radius:var(--r);min-height:28px;color:var(--fg)}
.nav:hover{background:var(--hover)}.nav[aria-current=true]{background:var(--hover);font-weight:600}
.nav .nm{flex:1}.nav kbd,kbd{font:11px ui-monospace,Consolas,monospace;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--surface)}
.cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.cnt.d{color:var(--purple);font-weight:700}.cnt.b{color:var(--danger);font-weight:700}
.sw{display:flex;flex-direction:column}

.ibtn{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);min-height:28px;padding:2px 8px}
.ibtn:hover{background:var(--hover)}.ibtn[aria-pressed=true]{background:var(--soft);border-color:var(--primary);color:var(--primary)}
.body{display:flex;flex:1;min-height:0}.pane{flex:1;overflow:auto;min-width:0}
.detail{width:min(440px,45%);border-inline-start:1px solid var(--border);overflow:auto;padding:16px;background:var(--surface);flex:none}
.grp{position:sticky;top:0;background:var(--surface-2);padding:4px 16px;font-size:12px;font-weight:600;display:flex;gap:8px;border-block-end:1px solid var(--border);z-index:1}
.row{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-block-end:1px solid var(--border);cursor:default;width:100%;border-inline:0;border-top:0;background:none;text-align:start}
.row:hover,.row.sel{background:var(--hover)}.row.sel{box-shadow:inset 2px 0 var(--primary)}[dir=rtl] .row.sel{box-shadow:inset -2px 0 var(--primary)}
.row .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:none}.sd.progress{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}.sd.done{background:var(--ok);border-color:var(--ok)}.sd.blocked{border-color:var(--danger);background:var(--danger)}.sd.waiting{border-color:var(--purple)}
.bd{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:8px;padding:12px;height:100%;overflow:auto;align-items:start}
.bc{background:var(--surface-2);border-radius:var(--r);padding:6px;min-height:60px}.bc h3{font-size:12px;margin:2px 4px 6px;display:flex;gap:6px;align-items:center}
.k{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px;margin-block-end:6px;width:100%;text-align:start;display:block}
.k:hover,.k.sel{border-color:var(--primary)}.k .m{display:flex;gap:6px;align-items:center;margin-block-start:4px;color:var(--muted);font-size:12px}
.k .m .ava{margin-inline-start:auto;width:18px;height:18px;font-size:9px}
.inb{display:grid;grid-template-columns:260px 1fr;height:100%}.inb .lst{border-inline-end:1px solid var(--border);overflow:auto}
.inb .main2{padding:20px;overflow:auto;max-width:720px}
.dcard{border:0;padding:0;background:none;border-radius:0}
.opt{min-height:40px}.opt b::before{content:attr(data-n);}
.kn{font:11px ui-monospace,Consolas,monospace;border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--muted);margin-inline-end:8px;background:var(--surface)}
.hint{padding:4px 16px;border-block-start:1px solid var(--border);color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
#pal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:20}#pal.on{display:flex}
#pal .box{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:min(520px,94vw);box-shadow:0 16px 48px rgba(0,0,0,.35)}
#pal input{width:100%;border:0;border-block-end:1px solid var(--border);background:none;padding:12px 16px;font-size:15px;outline:0}
#pal .it{display:flex;padding:8px 16px;gap:8px;width:100%;border:0;background:none;text-align:start}#pal .it:hover,#pal .it.sel{background:var(--hover)}
#mt{display:none}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;inset-block:0;inset-inline-start:0;width:240px;z-index:15;transform:translateX(-105%);transition:transform .15s}[dir=rtl] .side{transform:translateX(105%)}.side.on{transform:none}#mt{display:inline-block}
 .detail{position:fixed;inset:44px 0 0 0;width:auto;z-index:12}.inb{grid-template-columns:1fr}.inb .lst{max-height:34vh;border-inline-end:0;border-block-end:1px solid var(--border)}.bar input{display:none}.hint{display:none}}
</style>

function loadImg(file){if(!file||!file.type.startsWith('image/'))return;const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const s=Math.min(1,1280/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);rp.img=c;rp.strokes=[];URL.revokeObjectURL(u);rp.cb();};im.src=u;}
